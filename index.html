<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand Theremin Tracker</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #0a0a0f;
      background-image:
        linear-gradient(rgba(10, 10, 15, 0.56), rgba(10, 10, 15, 0.72)),
        url("assets/aphrodite.png");
      background-position: center, center;
      background-repeat: no-repeat, no-repeat;
      background-size: auto, cover;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
      touch-action: manipulation;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f4fbff;
      background: radial-gradient(circle at center, #13202b 0%, #0a0a0f 72%);
      font-size: clamp(1.2rem, 2vw, 2rem);
      letter-spacing: 0;
      z-index: 2;
      transition: opacity 180ms ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading.error {
      padding: 24px;
      color: #ffd6e7;
      text-align: center;
      line-height: 1.35;
    }

    .app-overlay {
      position: fixed;
      top: 20px;
      right: 20px;
      left: 20px;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      pointer-events: none;
    }

    .hud,
    .instructions,
    .music-controls {
      box-sizing: border-box;
      color: rgba(244, 251, 255, 0.82);
      background: rgba(10, 10, 15, 0.52);
      border: 1px solid rgba(0, 245, 255, 0.16);
      border-radius: 8px;
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.1);
      font-size: 11px;
      line-height: 1.2;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      user-select: none;
      backdrop-filter: blur(14px);
    }

    .hud {
      display: grid;
      gap: 7px;
      width: 170px;
      padding: 12px;
      border-color: rgba(0, 245, 255, 0.2);
      box-shadow: 0 0 28px rgba(0, 245, 255, 0.12);
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
      color: rgba(244, 251, 255, 0.66);
      white-space: nowrap;
    }

    .hud-value {
      color: #f4fbff;
      text-align: right;
      text-shadow: 0 0 10px rgba(0, 245, 255, 0.58);
    }

    .controls-stack {
      display: grid;
      grid-template-columns: 150px 196px;
      align-items: start;
      gap: 12px;
      pointer-events: none;
    }

    .instructions {
      display: grid;
      gap: 7px;
      width: 150px;
      padding: 12px;
      color: rgba(244, 251, 255, 0.72);
      border: 1px solid rgba(244, 251, 255, 0.12);
      box-shadow: 0 0 24px rgba(76, 0, 255, 0.1);
      text-align: right;
      pointer-events: none;
    }

    .music-controls {
      display: grid;
      gap: 10px;
      width: 196px;
      padding: 12px;
      color: rgba(244, 251, 255, 0.82);
      pointer-events: auto;
    }

    .music-controls label {
      display: grid;
      gap: 4px;
    }

    .music-controls .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .music-controls select,
    .music-controls button,
    .music-controls a {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(244, 251, 255, 0.16);
      border-radius: 6px;
      min-height: 30px;
      padding: 6px 8px;
      color: #f4fbff;
      background: rgba(244, 251, 255, 0.08);
      font: inherit;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .music-controls button,
    .music-controls a {
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .music-controls button:disabled {
      cursor: default;
      opacity: 0.58;
    }

    .music-controls input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #168cff;
    }

    .music-controls .hidden {
      display: none;
    }

    .status {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 1;
      max-width: min(520px, calc(100vw - 32px));
      padding: 9px 12px;
      color: rgba(244, 251, 255, 0.86);
      background: rgba(10, 10, 15, 0.52);
      border: 1px solid rgba(0, 245, 255, 0.18);
      border-radius: 8px;
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.1);
      font-size: 12px;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-align: center;
      text-transform: uppercase;
      transform: translateX(-50%);
      pointer-events: none;
      backdrop-filter: blur(12px);
    }

    .status.hidden {
      display: none;
    }

    .status.warning {
      color: #ffe7a6;
      border-color: rgba(255, 231, 166, 0.26);
      box-shadow: 0 0 24px rgba(255, 231, 166, 0.12);
    }

    @media (max-width: 760px) {
      .app-overlay {
        top: 12px;
        right: 12px;
        left: 12px;
        display: grid;
        grid-template-columns: minmax(112px, 1fr) minmax(172px, 188px);
        gap: 10px;
      }

      .hud {
        width: auto;
        min-width: 0;
        padding: 9px 10px;
        font-size: 10px;
      }

      .controls-stack {
        justify-self: end;
        grid-template-columns: 1fr;
        gap: 8px;
        width: min(188px, 100%);
      }

      .instructions {
        width: 100%;
        padding: 9px 10px;
        font-size: 10px;
      }

      .music-controls {
        width: 100%;
        padding: 9px 10px;
        font-size: 10px;
      }

      .status {
        bottom: 86px;
        font-size: 10px;
      }
    }

    @media (max-width: 340px) {
      .app-overlay {
        grid-template-columns: 1fr;
      }

      .controls-stack {
        justify-self: stretch;
        width: 100%;
      }

      .instructions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        text-align: left;
      }
    }

    video {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading model...</div>
  <div class="app-overlay">
    <div id="hud" class="hud">
      <div class="hud-row">Note <span id="noteLabel" class="hud-value">A</span></div>
      <div class="hud-row">Octave <span id="octaveLabel" class="hud-value">3</span></div>
      <div class="hud-row">Osc <span id="oscillatorLabel" class="hud-value">sine</span></div>
      <div class="hud-row">Audio <span id="audioLabel" class="hud-value">click</span></div>
    </div>
    <div class="controls-stack">
      <div class="instructions" aria-label="Controls">
        <div>Click: audio</div>
        <div>Left Y: pitch</div>
        <div>Right Y: volume</div>
        <div>Right X: reverb</div>
        <div>Space: wave</div>
        <div>Rec: 15s clip</div>
      </div>
      <div class="music-controls" aria-label="Music controls">
        <label>
          Scale
          <select id="scaleSelect">
            <option value="a-minor-pentatonic">A minor pent</option>
            <option value="a-major-pentatonic">A major pent</option>
            <option value="a-blues">A blues</option>
            <option value="chromatic">Chromatic</option>
          </select>
        </label>
        <label class="toggle-row">
          Delay
          <input id="delayToggle" type="checkbox">
        </label>
        <label class="toggle-row">
          Gate
          <input id="gateToggle" type="checkbox" checked>
        </label>
        <button id="recordButton" type="button">Rec 15s</button>
        <a id="downloadLink" class="hidden" download="air-theremin.webm">Download</a>
      </div>
    </div>
  </div>
  <div id="status" class="status hidden" role="status" aria-live="polite"></div>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const loading = document.getElementById("loading");
    const noteLabel = document.getElementById("noteLabel");
    const octaveLabel = document.getElementById("octaveLabel");
    const oscillatorLabel = document.getElementById("oscillatorLabel");
    const audioLabel = document.getElementById("audioLabel");
    const status = document.getElementById("status");
    const scaleSelect = document.getElementById("scaleSelect");
    const delayToggle = document.getElementById("delayToggle");
    const gateToggle = document.getElementById("gateToggle");
    const recordButton = document.getElementById("recordButton");
    const downloadLink = document.getElementById("downloadLink");

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];

    const MIN_FREQUENCY = 110;
    const MAX_FREQUENCY = 880;
    const MAX_OSCILLATOR_2_GAIN = 0.8;
    const MAX_REVERB_MIX = 0.6;
    const OSCILLATOR_1_GAIN = 0.18;
    const PARAM_RAMP_SECONDS = 0.05;
    const ATTACK_SECONDS = 0.08;
    const RELEASE_SECONDS = 0.2;
    const VOLUME_GATE_THRESHOLD = 0.06;
    const DELAY_WET_GAIN = 0.28;
    const RECORDING_SECONDS = 15;
    const NO_HANDS_FADE_DELAY_MS = 200;
    const SCALE_DEFINITIONS = {
      "a-minor-pentatonic": {
        label: "A minor pent",
        notes: [
          { frequency: 110, note: "A", octave: 2 },
          { frequency: 130.8, note: "C", octave: 3 },
          { frequency: 146.8, note: "D", octave: 3 },
          { frequency: 164.8, note: "E", octave: 3 },
          { frequency: 196, note: "G", octave: 3 },
          { frequency: 220, note: "A", octave: 3 },
          { frequency: 261.6, note: "C", octave: 4 },
          { frequency: 293.7, note: "D", octave: 4 },
          { frequency: 329.6, note: "E", octave: 4 },
          { frequency: 392, note: "G", octave: 4 },
          { frequency: 440, note: "A", octave: 4 },
          { frequency: 523.3, note: "C", octave: 5 },
          { frequency: 587.3, note: "D", octave: 5 },
          { frequency: 659.3, note: "E", octave: 5 },
          { frequency: 784, note: "G", octave: 5 },
          { frequency: 880, note: "A", octave: 5 }
        ]
      },
      "a-major-pentatonic": {
        label: "A major pent",
        notes: [
          { frequency: 110, note: "A", octave: 2 },
          { frequency: 123.5, note: "B", octave: 2 },
          { frequency: 138.6, note: "C#", octave: 3 },
          { frequency: 164.8, note: "E", octave: 3 },
          { frequency: 185, note: "F#", octave: 3 },
          { frequency: 220, note: "A", octave: 3 },
          { frequency: 246.9, note: "B", octave: 3 },
          { frequency: 277.2, note: "C#", octave: 4 },
          { frequency: 329.6, note: "E", octave: 4 },
          { frequency: 370, note: "F#", octave: 4 },
          { frequency: 440, note: "A", octave: 4 },
          { frequency: 493.9, note: "B", octave: 4 },
          { frequency: 554.4, note: "C#", octave: 5 },
          { frequency: 659.3, note: "E", octave: 5 },
          { frequency: 740, note: "F#", octave: 5 },
          { frequency: 880, note: "A", octave: 5 }
        ]
      },
      "a-blues": {
        label: "A blues",
        notes: [
          { frequency: 110, note: "A", octave: 2 },
          { frequency: 130.8, note: "C", octave: 3 },
          { frequency: 146.8, note: "D", octave: 3 },
          { frequency: 155.6, note: "Eb", octave: 3 },
          { frequency: 164.8, note: "E", octave: 3 },
          { frequency: 196, note: "G", octave: 3 },
          { frequency: 220, note: "A", octave: 3 },
          { frequency: 261.6, note: "C", octave: 4 },
          { frequency: 293.7, note: "D", octave: 4 },
          { frequency: 311.1, note: "Eb", octave: 4 },
          { frequency: 329.6, note: "E", octave: 4 },
          { frequency: 392, note: "G", octave: 4 },
          { frequency: 440, note: "A", octave: 4 },
          { frequency: 523.3, note: "C", octave: 5 },
          { frequency: 587.3, note: "D", octave: 5 },
          { frequency: 622.3, note: "Eb", octave: 5 },
          { frequency: 659.3, note: "E", octave: 5 },
          { frequency: 784, note: "G", octave: 5 },
          { frequency: 880, note: "A", octave: 5 }
        ]
      },
      chromatic: {
        label: "Chromatic",
        notes: buildChromaticScale(45, 81)
      }
    };
    const OSCILLATOR_TYPES = ["sine", "triangle", "sawtooth"];
    const DEEP_VIOLET = { r: 76, g: 0, b: 255 };
    const ELECTRIC_CYAN = { r: 0, g: 245, b: 255 };
    const FINGERTIP_INDICES = [4, 8, 12, 16, 20];
    const MAX_TRAIL_POINTS = 15;
    const RING_LIFETIME_FRAMES = 40;
    const RING_SPAWN_INTERVAL = 13;

    let handLandmarker;
    let canvasWidth = 0;
    let canvasHeight = 0;
    let audioContext;
    let oscillator1;
    let oscillator2;
    let oscillator1Gain;
    let oscillator2Gain;
    let masterGain;
    let convolver;
    let dryGain;
    let wetGain;
    let delayNode;
    let delayFeedbackGain;
    let delayWetGain;
    let analyser;
    let waveformData;
    let recordDestination;
    let mediaRecorder;
    let recordingTimeout;
    let recordingUrl;
    let audioStarted = false;
    let audioStarting = false;
    let lastPitchY = 0.5;
    let currentScaleKey = "a-minor-pentatonic";
    let currentPitchNote = SCALE_DEFINITIONS[currentScaleKey].notes[5];
    let oscillatorTypeIndex = 0;
    let delayEnabled = false;
    let gateEnabled = true;
    let lastHandsDetectedTime = 0;
    let frameCount = 0;
    const fingertipTrails = new Map();

    function buildChromaticScale(minMidi, maxMidi) {
      const noteNames = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
      const notes = [];

      for (let midi = minMidi; midi <= maxMidi; midi += 1) {
        notes.push({
          frequency: Number((440 * 2 ** ((midi - 69) / 12)).toFixed(1)),
          note: noteNames[midi % 12],
          octave: Math.floor(midi / 12) - 1
        });
      }

      return notes;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function lerp(start, end, amount) {
      return start + (end - start) * amount;
    }

    function getPitchColor(y) {
      const highPitchAmount = 1 - clamp(y, 0, 1);

      return {
        r: Math.round(lerp(DEEP_VIOLET.r, ELECTRIC_CYAN.r, highPitchAmount)),
        g: Math.round(lerp(DEEP_VIOLET.g, ELECTRIC_CYAN.g, highPitchAmount)),
        b: Math.round(lerp(DEEP_VIOLET.b, ELECTRIC_CYAN.b, highPitchAmount))
      };
    }

    function colorToCss(color, alpha = 1) {
      return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
    }

    function mapYToFrequency(y) {
      const clampedY = clamp(y, 0, 1);
      return MAX_FREQUENCY * (MIN_FREQUENCY / MAX_FREQUENCY) ** clampedY;
    }

    function quantizeToCurrentScale(frequency) {
      const notes = SCALE_DEFINITIONS[currentScaleKey].notes;

      return notes.reduce((closest, candidate) => {
        return Math.abs(candidate.frequency - frequency) < Math.abs(closest.frequency - frequency)
          ? candidate
          : closest;
      }, notes[0]);
    }

    function mapYToOscillator2Gain(y) {
      return clamp(y, 0, 1) * MAX_OSCILLATOR_2_GAIN;
    }

    function mapXToReverbMix(x) {
      return clamp(x, 0, 1) * MAX_REVERB_MIX;
    }

    function updateHud() {
      noteLabel.textContent = currentPitchNote.note;
      octaveLabel.textContent = String(currentPitchNote.octave);
      oscillatorLabel.textContent = OSCILLATOR_TYPES[oscillatorTypeIndex];
    }

    let statusClearTimer;

    function setStatus(message, type = "info", timeoutMs = 0) {
      window.clearTimeout(statusClearTimer);
      status.textContent = message;
      status.className = `status ${type === "warning" ? "warning" : ""}`;

      if (timeoutMs > 0) {
        statusClearTimer = window.setTimeout(() => {
          status.classList.add("hidden");
        }, timeoutMs);
      }
    }

    function rampAudioParam(audioParam, value, duration = PARAM_RAMP_SECONDS) {
      if (!audioContext) {
        return;
      }

      const now = audioContext.currentTime;
      if (typeof audioParam.cancelAndHoldAtTime === "function") {
        audioParam.cancelAndHoldAtTime(now);
      } else {
        const currentValue = audioParam.value;
        audioParam.cancelScheduledValues(now);
        audioParam.setValueAtTime(currentValue, now);
      }

      audioParam.linearRampToValueAtTime(value, now + duration);
    }

    function createReverbImpulseResponse(context) {
      const duration = 2.2;
      const length = Math.floor(context.sampleRate * duration);
      const impulse = context.createBuffer(2, length, context.sampleRate);

      for (let channel = 0; channel < impulse.numberOfChannels; channel += 1) {
        const impulseData = impulse.getChannelData(channel);

        for (let i = 0; i < length; i += 1) {
          const progress = i / length;
          const decay = (1 - progress) ** 2.6;
          impulseData[i] = (Math.random() * 2 - 1) * decay;
        }
      }

      return impulse;
    }

    function applyOscillatorType() {
      const oscillatorType = OSCILLATOR_TYPES[oscillatorTypeIndex];

      if (oscillator1) {
        oscillator1.type = oscillatorType;
      }

      if (oscillator2) {
        oscillator2.type = oscillatorType;
      }

      updateHud();
    }

    function cycleOscillatorType() {
      oscillatorTypeIndex = (oscillatorTypeIndex + 1) % OSCILLATOR_TYPES.length;
      applyOscillatorType();
    }

    function setScale(scaleKey) {
      if (!SCALE_DEFINITIONS[scaleKey]) {
        return;
      }

      currentScaleKey = scaleKey;
      currentPitchNote = quantizeToCurrentScale(mapYToFrequency(lastPitchY));

      if (oscillator1) {
        rampAudioParam(oscillator1.frequency, currentPitchNote.frequency);
      }

      updateHud();
      setStatus(`${SCALE_DEFINITIONS[currentScaleKey].label} scale`, "info", 1200);
    }

    function setDelayEnabled(enabled) {
      delayEnabled = enabled;
      delayToggle.checked = enabled;

      if (delayWetGain) {
        rampAudioParam(delayWetGain.gain, enabled ? DELAY_WET_GAIN : 0);
      }

      setStatus(enabled ? "Delay on" : "Delay off", "info", 900);
    }

    function setGateEnabled(enabled) {
      gateEnabled = enabled;
      gateToggle.checked = enabled;
      setStatus(enabled ? "Volume gate on" : "Volume gate off", "info", 900);
    }

    function getRecordingMimeType() {
      const mimeTypes = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/mp4"
      ];

      return mimeTypes.find((mimeType) => {
        return window.MediaRecorder && MediaRecorder.isTypeSupported(mimeType);
      }) || "";
    }

    function finishRecording(chunks) {
      const mimeType = mediaRecorder?.mimeType || getRecordingMimeType() || "audio/webm";
      const blob = new Blob(chunks, { type: mimeType });

      if (recordingUrl) {
        URL.revokeObjectURL(recordingUrl);
      }

      recordingUrl = URL.createObjectURL(blob);
      const extension = mimeType.includes("mp4") ? "m4a" : "webm";
      downloadLink.href = recordingUrl;
      downloadLink.download = `air-theremin-${new Date().toISOString().replace(/[:.]/g, "-")}.${extension}`;
      downloadLink.classList.remove("hidden");
      recordButton.disabled = false;
      recordButton.textContent = "Rec 15s";
      setStatus("Recording ready", "info", 2200);
    }

    async function recordClip() {
      if (mediaRecorder?.state === "recording") {
        return;
      }

      await startAudio();

      if (!audioStarted || !recordDestination) {
        setStatus("Audio unavailable", "warning", 1800);
        return;
      }

      if (!window.MediaRecorder) {
        setStatus("Recording unsupported", "warning", 2200);
        return;
      }

      const chunks = [];
      const mimeType = getRecordingMimeType();
      const recorderOptions = mimeType ? { mimeType } : undefined;

      try {
        mediaRecorder = new MediaRecorder(recordDestination.stream, recorderOptions);
      } catch (error) {
        console.error(error);
        setStatus("Could not start recorder", "warning", 2200);
        return;
      }

      downloadLink.classList.add("hidden");
      recordButton.disabled = true;
      recordButton.textContent = "Recording...";
      setStatus(`Recording ${RECORDING_SECONDS}s clip`, "warning");

      mediaRecorder.addEventListener("dataavailable", (event) => {
        if (event.data.size > 0) {
          chunks.push(event.data);
        }
      });

      mediaRecorder.addEventListener("stop", () => {
        window.clearTimeout(recordingTimeout);
        finishRecording(chunks);
      }, { once: true });

      mediaRecorder.start();
      recordingTimeout = window.setTimeout(() => {
        if (mediaRecorder?.state === "recording") {
          mediaRecorder.stop();
        }
      }, RECORDING_SECONDS * 1000);
    }

    async function startAudio() {
      if (audioStarted || audioStarting) {
        return;
      }

      audioStarting = true;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        audioStarting = false;
        audioLabel.textContent = "unsupported";
        return;
      }

      audioContext = new AudioContextClass();
      const now = audioContext.currentTime;

      oscillator1 = audioContext.createOscillator();
      oscillator2 = audioContext.createOscillator();
      oscillator1Gain = audioContext.createGain();
      oscillator2Gain = audioContext.createGain();
      masterGain = audioContext.createGain();
      convolver = audioContext.createConvolver();
      dryGain = audioContext.createGain();
      wetGain = audioContext.createGain();
      delayNode = audioContext.createDelay(1);
      delayFeedbackGain = audioContext.createGain();
      delayWetGain = audioContext.createGain();
      analyser = audioContext.createAnalyser();
      recordDestination = audioContext.createMediaStreamDestination();
      convolver.buffer = createReverbImpulseResponse(audioContext);
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.78;
      waveformData = new Uint8Array(analyser.fftSize);

      oscillator1.type = OSCILLATOR_TYPES[oscillatorTypeIndex];
      oscillator2.type = OSCILLATOR_TYPES[oscillatorTypeIndex];

      oscillator1.frequency.setValueAtTime(currentPitchNote.frequency, now);
      oscillator2.frequency.setValueAtTime(220, now);
      oscillator1Gain.gain.setValueAtTime(0, now);
      oscillator2Gain.gain.setValueAtTime(0, now);
      masterGain.gain.setValueAtTime(0.8, now);
      dryGain.gain.setValueAtTime(1, now);
      wetGain.gain.setValueAtTime(0, now);
      delayNode.delayTime.setValueAtTime(0.27, now);
      delayFeedbackGain.gain.setValueAtTime(0.32, now);
      delayWetGain.gain.setValueAtTime(delayEnabled ? DELAY_WET_GAIN : 0, now);

      oscillator1.connect(oscillator1Gain);
      oscillator2.connect(oscillator2Gain);
      oscillator1Gain.connect(masterGain);
      oscillator2Gain.connect(masterGain);
      masterGain.connect(dryGain);
      masterGain.connect(convolver);
      masterGain.connect(delayNode);
      convolver.connect(wetGain);
      delayNode.connect(delayFeedbackGain);
      delayFeedbackGain.connect(delayNode);
      delayNode.connect(delayWetGain);
      dryGain.connect(analyser);
      wetGain.connect(analyser);
      delayWetGain.connect(analyser);
      analyser.connect(audioContext.destination);
      analyser.connect(recordDestination);

      oscillator1.start();
      oscillator2.start();

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      audioStarted = true;
      audioStarting = false;
      lastHandsDetectedTime = performance.now();
      audioLabel.textContent = "on";
    }

    function updateAudio(wristControls, handsDetected, frameTime) {
      if (!audioStarted || !audioContext) {
        return;
      }

      if (handsDetected) {
        lastHandsDetectedTime = frameTime;
      }

      if (frameTime - lastHandsDetectedTime > NO_HANDS_FADE_DELAY_MS) {
        rampAudioParam(oscillator1Gain.gain, 0, RELEASE_SECONDS);
        rampAudioParam(oscillator2Gain.gain, 0, RELEASE_SECONDS);
        return;
      }

      rampAudioParam(oscillator1Gain.gain, OSCILLATOR_1_GAIN, ATTACK_SECONDS);

      if (typeof wristControls.Left?.y === "number") {
        currentPitchNote = quantizeToCurrentScale(mapYToFrequency(wristControls.Left.y));
        rampAudioParam(oscillator1.frequency, currentPitchNote.frequency);
        updateHud();
      }

      if (typeof wristControls.Right?.y === "number") {
        const rawGain = mapYToOscillator2Gain(wristControls.Right.y);
        const gatedGain = gateEnabled && rawGain < VOLUME_GATE_THRESHOLD ? 0 : rawGain;
        const envelopeTime = gatedGain > oscillator2Gain.gain.value ? ATTACK_SECONDS : RELEASE_SECONDS;
        rampAudioParam(oscillator2Gain.gain, gatedGain, envelopeTime);
      } else {
        rampAudioParam(oscillator2Gain.gain, 0, RELEASE_SECONDS);
      }

      if (typeof wristControls.Right?.x === "number") {
        const wetMix = mapXToReverbMix(wristControls.Right.x);
        rampAudioParam(dryGain.gain, 1 - wetMix);
        rampAudioParam(wetGain.gain, wetMix);
      } else {
        rampAudioParam(dryGain.gain, 1);
        rampAudioParam(wetGain.gain, 0);
      }
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.round(window.innerWidth * dpr);
      const height = Math.round(window.innerHeight * dpr);

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      canvasWidth = canvas.width;
      canvasHeight = canvas.height;
    }

    function getVideoBox() {
      if (!video.videoWidth || !video.videoHeight) {
        return;
      }

      const videoRatio = video.videoWidth / video.videoHeight;
      const canvasRatio = canvasWidth / canvasHeight;
      let drawWidth = canvasWidth;
      let drawHeight = canvasHeight;
      let offsetX = 0;
      let offsetY = 0;

      if (videoRatio > canvasRatio) {
        drawHeight = canvasHeight;
        drawWidth = drawHeight * videoRatio;
        offsetX = (canvasWidth - drawWidth) / 2;
      } else {
        drawWidth = canvasWidth;
        drawHeight = drawWidth / videoRatio;
        offsetY = (canvasHeight - drawHeight) / 2;
      }

      return { drawWidth, drawHeight, offsetX, offsetY };
    }

    function landmarkToCanvasPoint(landmark, videoBox) {
      return {
        x: canvasWidth - (videoBox.offsetX + landmark.x * videoBox.drawWidth),
        y: videoBox.offsetY + landmark.y * videoBox.drawHeight
      };
    }

    function getHandedness(results, index) {
      const categories = results.handedness?.[index] || results.handednesses?.[index];
      return categories?.[0]?.categoryName;
    }

    function drawHand(landmarks, videoBox, color) {
      const lineColor = colorToCss(color, 0.72);
      const dotColor = colorToCss(color);

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = dotColor;

      ctx.strokeStyle = lineColor;
      ctx.lineWidth = Math.max(2, canvasWidth * 0.003);
      ctx.shadowBlur = 14;
      ctx.beginPath();
      for (const [startIndex, endIndex] of HAND_CONNECTIONS) {
        const start = landmarkToCanvasPoint(landmarks[startIndex], videoBox);
        const end = landmarkToCanvasPoint(landmarks[endIndex], videoBox);
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
      }
      ctx.stroke();

      const radius = Math.max(4, canvasWidth * 0.0055);
      ctx.fillStyle = dotColor;
      ctx.shadowBlur = 22;
      for (const landmark of landmarks) {
        const point = landmarkToCanvasPoint(landmark, videoBox);
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function updateFingertipTrails(results, videoBox) {
      results.landmarks.forEach((landmarks, handIndex) => {
        const handedness = getHandedness(results, handIndex) || `Hand${handIndex}`;

        FINGERTIP_INDICES.forEach((tipIndex) => {
          const point = landmarkToCanvasPoint(landmarks[tipIndex], videoBox);
          const trailKey = `${handedness}-${tipIndex}`;
          const trail = fingertipTrails.get(trailKey) || [];

          trail.push({ ...point, frame: frameCount });
          fingertipTrails.set(trailKey, trail.slice(-MAX_TRAIL_POINTS));
        });
      });
    }

    function drawFingertipTrails(color) {
      ctx.save();
      ctx.shadowColor = colorToCss(color);
      ctx.shadowBlur = 16;

      for (const [trailKey, trail] of fingertipTrails) {
        const visibleTrail = trail.filter((point) => frameCount - point.frame < MAX_TRAIL_POINTS);

        if (visibleTrail.length === 0) {
          fingertipTrails.delete(trailKey);
          continue;
        }

        fingertipTrails.set(trailKey, visibleTrail);

        visibleTrail.forEach((point, index) => {
          const ageFromNewest = visibleTrail.length - 1 - index;
          const alpha = (1 - ageFromNewest / MAX_TRAIL_POINTS) * 0.55;
          const radius = Math.max(2, canvasWidth * 0.0028) * (1 - ageFromNewest / (MAX_TRAIL_POINTS * 1.4));

          ctx.fillStyle = colorToCss(color, alpha);
          ctx.beginPath();
          ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      ctx.restore();
    }

    function getWristPoints(results, videoBox) {
      return results.landmarks.map((landmarks) => landmarkToCanvasPoint(landmarks[0], videoBox));
    }

    function drawSoundRings(wristPoints, color) {
      if (wristPoints.length === 0) {
        return;
      }

      const maxRadius = Math.min(canvasWidth, canvasHeight) * 0.16;

      ctx.save();
      ctx.lineCap = "round";
      ctx.shadowColor = colorToCss(color);
      ctx.shadowBlur = 20;

      wristPoints.forEach((wristPoint) => {
        for (let ringIndex = 0; ringIndex < 3; ringIndex += 1) {
          const age = (frameCount + ringIndex * RING_SPAWN_INTERVAL) % RING_LIFETIME_FRAMES;
          const progress = age / RING_LIFETIME_FRAMES;
          const alpha = (1 - progress) * 0.42;
          const radius = Math.max(12, canvasWidth * 0.012) + progress * maxRadius;

          ctx.strokeStyle = colorToCss(color, alpha);
          ctx.lineWidth = Math.max(1.5, canvasWidth * 0.0024) * (1 - progress * 0.45);
          ctx.beginPath();
          ctx.arc(wristPoint.x, wristPoint.y, radius, 0, Math.PI * 2);
          ctx.stroke();
        }
      });

      ctx.restore();
    }

    function drawWaveformVisualizer(color) {
      if (!analyser || !waveformData) {
        return;
      }

      analyser.getByteTimeDomainData(waveformData);

      const centerX = canvasWidth / 2;
      const radius = Math.min(canvasWidth * 0.48, canvasHeight * 0.55);
      const centerY = canvasHeight + radius * 0.16;
      const startAngle = Math.PI * 1.08;
      const endAngle = Math.PI * 1.92;
      const amplitude = canvasHeight * 0.075;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = colorToCss(color);
      ctx.shadowBlur = 24;
      ctx.strokeStyle = colorToCss(color, 0.78);
      ctx.lineWidth = Math.max(2, canvasWidth * 0.0032);
      ctx.beginPath();

      for (let i = 0; i < waveformData.length; i += 1) {
        const sample = (waveformData[i] - 128) / 128;
        const amount = i / (waveformData.length - 1);
        const angle = lerp(startAngle, endAngle, amount);
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius + sample * amplitude;

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();
      ctx.restore();
    }

    function getWristControls(results, videoBox) {
      const wristControls = {
        Left: undefined,
        Right: undefined
      };

      results.landmarks.forEach((landmarks, index) => {
        const handedness = getHandedness(results, index);

        if (handedness === "Left" || handedness === "Right") {
          const wristPoint = landmarkToCanvasPoint(landmarks[0], videoBox);

          wristControls[handedness] = {
            x: clamp(wristPoint.x / canvasWidth, 0, 1),
            y: landmarks[0]?.y
          };
        }
      });

      return wristControls;
    }

    function renderFrame() {
      frameCount += 1;
      const frameTime = performance.now();
      resizeCanvas();
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      const videoBox = getVideoBox();
      let pitchColor = getPitchColor(lastPitchY);

      if (handLandmarker && videoBox) {
        const results = handLandmarker.detectForVideo(video, frameTime);
        const wristControls = getWristControls(results, videoBox);

        if (typeof wristControls.Left?.y === "number") {
          lastPitchY = wristControls.Left.y;
          currentPitchNote = quantizeToCurrentScale(mapYToFrequency(wristControls.Left.y));
          pitchColor = getPitchColor(lastPitchY);
          updateHud();
        }

        console.log("Wrist Y positions", {
          Left: wristControls.Left?.y,
          Right: wristControls.Right?.y
        });
        updateAudio(wristControls, results.landmarks.length > 0, frameTime);
        updateFingertipTrails(results, videoBox);

        drawSoundRings(getWristPoints(results, videoBox), pitchColor);
        drawFingertipTrails(pitchColor);

        results.landmarks.forEach((landmarks) => {
          drawHand(landmarks, videoBox, pitchColor);
        });
      } else {
        drawFingertipTrails(pitchColor);
      }

      drawWaveformVisualizer(pitchColor);
      requestAnimationFrame(renderFrame);
    }

    async function initialize() {
      resizeCanvas();

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });

      loading.classList.add("hidden");
      renderFrame();
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("pointerdown", startAudio);
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        startAudio();
        cycleOscillatorType();
      }
    });
    scaleSelect.addEventListener("change", () => setScale(scaleSelect.value));
    delayToggle.addEventListener("change", () => setDelayEnabled(delayToggle.checked));
    gateToggle.addEventListener("change", () => setGateEnabled(gateToggle.checked));
    recordButton.addEventListener("click", (event) => {
      event.stopPropagation();
      recordClip();
    });

    updateHud();

    initialize().catch((error) => {
      console.error(error);
      loading.textContent = "Could not initialize webcam or hand tracking.";
    });
  </script>
</body>
</html>
